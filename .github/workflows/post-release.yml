name: Post-release

# Checks a published release the way a user would: installs the version from PyPI with pipx and runs each published
# binary on a runner of its own kind (Windows, Linux and macOS, x86_64 and arm64), each in a clean runner, then runs
# --version and --selftest. A failure means the release is
# broken for users. It publishes nothing. It expects the six-binary release layout of 0.2.0 and later; a manual run
# against v0.1.0 (Windows exe only) fails by design.
#
# Triggers: `release: published` fires for releases made by a person. The Release workflow creates its release with
# GITHUB_TOKEN, and GitHub does not start workflows from that token's events, so this also runs when the Release
# workflow finishes (`workflow_run`). A manual run takes the tag as input.

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check, for example v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: post-release-${{ github.event.release.tag_name || github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  tag:
    name: Resolve the tag
    # A workflow_run for a failed Release run published nothing, so there is nothing to check.
    # Only a push-triggered run of this repository's own release.yml counts; a fork's workflow that is merely named
    # "Release" does not.
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.path, '.github/workflows/release.yml'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-${RUN_TAG:-$INPUT_TAG}}"
          if ! printf '%s' "$tag" | grep -Eq '^v0\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a v0.MINOR.PATCH release tag"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  # The shared workflow downloads every published file, checks SHA256SUMS and each attestation (signed by this
  # repository's release.yml), then runs each binary on a runner of its own kind with nothing of ours installed.
  published:
    name: Published files and binaries
    needs: tag
    permissions:
      contents: read
      attestations: read
    uses: WPTK/release-workflows/.github/workflows/verify-published.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      tag: ${{ needs.tag.outputs.tag }}
      app: wikihose
      asset-prefix: wikihose-${{ needs.tag.outputs.version }}
      expected-files: |
        wikihose-${{ needs.tag.outputs.version }}.tar.gz
        wikihose-${{ needs.tag.outputs.version }}-py3-none-any.whl
        wikihose-${{ needs.tag.outputs.version }}-windows-x86_64.exe
        wikihose-${{ needs.tag.outputs.version }}-linux-x86_64.tar.gz
        wikihose-${{ needs.tag.outputs.version }}-linux-arm64.tar.gz
        wikihose-${{ needs.tag.outputs.version }}-macos-arm64.tar.gz
        wikihose-${{ needs.tag.outputs.version }}-macos-x86_64.tar.gz
      smoke-command: |
        out=$("$BIN" --version); echo "$out"
        [ "$out" = "wikihose ${{ needs.tag.outputs.version }}" ] || { echo "::error::expected 'wikihose ${{ needs.tag.outputs.version }}'"; exit 1; }
        "$BIN" --selftest

  pipx:
    name: pipx install from PyPI (${{ matrix.os }})
    needs: tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pipx
      # PyPI can take a few minutes to list a new upload, so retry for up to ten minutes.
      - name: Install the released version
        run: |
          for attempt in $(seq 1 20); do
            if python -m pipx install --pip-args="--no-cache-dir" "wikihose==$VERSION"; then exit 0; fi
            echo "attempt $attempt: wikihose==$VERSION is not installable yet; waiting 30s"; sleep 30
          done
          echo "::error::wikihose==$VERSION never became installable from PyPI"; exit 1
      - name: Run it
        run: |
          python -m pipx ensurepath >/dev/null
          export PATH="$HOME/.local/bin:$PATH"
          out=$(wikihose --version); echo "$out"
          [ "$out" = "wikihose $VERSION" ] || { echo "::error::expected 'wikihose $VERSION'"; exit 1; }
          wikihose --selftest
