name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**/*.md', 'LICENSE']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # The Python 3.14 row is informational: requires-python allows it, but only 3.12 and 3.13 block a merge.
    continue-on-error: ${{ matrix.python == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m vulture --min-confidence 80
      - run: python -m pytest -n auto
      - run: python -m wikihose --version
      - run: python -m wikihose --selftest
      - run: python -m wikihose --replay src/wikihose/data/sample.jsonl.gz --headless-seconds 5
      - run: python -m wikihose --demo --headless-seconds 5
