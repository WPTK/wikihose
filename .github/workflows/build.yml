name: Build

# Builds the sdist, the wheel and a one-file binary for each platform, and checks each one runs. Called by release.yml on a tag; also
# runs by hand and on pull requests that touch the build, so a broken build shows up before a release rather than during
# one. Nothing here publishes anything and it has no secrets.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/build_binary.py
      - .github/release-constraints.txt
      - pyproject.toml
      - src/wikihose/**
      - .github/workflows/build.yml

permissions:
  contents: read

# Pins the isolated build environment too (hatchling and its dependencies), which a -c on the command line does not.
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/release-constraints.txt

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dist:
    name: sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -c .github/release-constraints.txt "build>=1.6.1,<2"
      - run: python -m build --outdir dist
      - name: Check the wheel installs and runs
        run: |
          python -m venv wheel-check
          wheel-check/bin/python -m pip install -c .github/release-constraints.txt dist/*.whl
          wheel-check/bin/wikihose --version
          wheel-check/bin/wikihose --selftest
      - name: Check the sdist installs and runs
        run: |
          python -m venv sdist-check
          sdist-check/bin/python -m pip install -c .github/release-constraints.txt dist/*.tar.gz
          sdist-check/bin/wikihose --selftest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  version:
    name: Read the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/wikihose/__init__.py)
          [ -n "$version" ] || { echo "::error::no __version__ in src/wikihose/__init__.py"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One binary per platform, built by the shared workflow (WPTK/release-workflows). The Linux builds run inside
  # python:3.12-bullseye, pinned by digest, so the binaries need only glibc 2.31 (Ubuntu 20.04, Debian 11 and newer);
  # building on the runner itself would set the floor at that runner's glibc. Move the pin on purpose. The macOS Intel
  # build uses GitHub's last Intel image (macos-13 is retired). Assets: wikihose-<version>-<os>-<arch>, .exe on Windows
  # and .tar.gz elsewhere. tzdata is in the package's own dependencies on Windows only; a binary may land on a system
  # with no zone files, so every binary carries its own.
  binary:
    name: Binary
    needs: version
    uses: WPTK/release-workflows/.github/workflows/build-binaries.yml@190565e35fd4f915762602c22f0d36843189b132 # main, to be re-pinned to v0.1.0
    with:
      app: wikihose
      asset-prefix: wikihose-${{ needs.version.outputs.version }}
      linux-container: python:3.12-bullseye@sha256:7cc929040c5e8cf6036c5099d62a83708427c131fb7a7c965b5ba51e995eea1c
      install-command: python -m pip install -c .github/release-constraints.txt . tzdata "pyinstaller>=6.22,<7"
      build-command: python scripts/build_binary.py --no-smoke
      smoke-command: python scripts/build_binary.py --smoke-only
